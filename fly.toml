# fly.toml app configuration file generated for conformance-suite on 2024-12-03T13:46:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'conformance-suite'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
